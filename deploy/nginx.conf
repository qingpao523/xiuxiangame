# ============================================================================
# deploy/nginx.conf —— Nginx 站点配置（design/20.0 Step6 部署）
# 同源架构：静态 web + /api 反代到 Node(:3000)，客户端 apiBase="" 走同源，无 CORS。
# 放到 /etc/nginx/conf.d/xiuxiangame.conf（路径按实际调整），nginx -t && systemctl reload nginx
# HTTPS：先跑 HTTP 用 certbot 申请证书，再启用 443 server 块。
# ============================================================================

# —— HTTP：用于 certbot 验证 + 强制跳转 HTTPS ——
server {
    listen 80;
    server_name your-domain.com;   # TODO: 改成你的域名/公网IP

    # certbot webroot 验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# —— HTTPS：静态 web + API 反代 ——
server {
    listen 443 ssl http2;
    server_name your-domain.com;   # TODO: 改成你的域名

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 静态客户端（web/ 目录）
    root /var/www/xiuxiangame/web;
    index index.html;

    # 关闭 HTML/JS 缓存，确保版本更新即时生效（对齐开发服 no-store 行为）
    location ~* \.(html|js)$ {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    # API 反代到 Node 服务
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
