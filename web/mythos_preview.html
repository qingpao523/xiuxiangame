<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>神话素材汇总与共鸣扩展 · 封神修道录</title>
<style>
  :root{
    --bg:#12121f; --panel:#1c1c30; --panel2:#242440; --line:#33335a;
    --gold:#FFD700; --gold-dim:#b89b2e; --text:#e8e8f0; --muted:#9a9ab8;
    --wood:#66BB6A; --fire:#FF5722; --earth:#C8A165; --metal:#cfd6e0; --water:#4FC3F7;
    --chan:#b388ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;line-height:1.6;padding-bottom:60px}
  header{padding:26px 20px 14px;text-align:center;background:linear-gradient(180deg,#1e1e38,#12121f);border-bottom:1px solid var(--line)}
  header h1{font-size:24px;color:var(--gold);letter-spacing:2px;font-weight:700}
  header p{color:var(--muted);font-size:13px;margin-top:6px}
  .legend{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .legend span{font-size:12px;padding:3px 10px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
  .wx-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .wx-wood{background:var(--wood)} .wx-fire{background:var(--fire)} .wx-earth{background:var(--earth)}
  .wx-metal{background:var(--metal)} .wx-water{background:var(--water)} .wx-none{background:#555}

  nav{position:sticky;top:0;z-index:10;display:flex;gap:2px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;padding:0 8px}
  nav button{flex:0 0 auto;background:none;border:none;color:var(--muted);padding:13px 16px;font-size:14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
  nav button.on{color:var(--gold);border-bottom-color:var(--gold)}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 16px 4px;max-width:1100px;margin:0 auto}
  .toolbar input{flex:1;min-width:180px;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:9px 12px;border-radius:8px;font-size:14px}
  .chip{font-size:12px;padding:6px 12px;border-radius:16px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;user-select:none}
  .chip.on{background:var(--gold);color:#1a1a2e;border-color:var(--gold);font-weight:600}

  main{max-width:1100px;margin:0 auto;padding:14px 16px}
  section{display:none} section.on{display:block}
  .group-title{font-size:15px;color:var(--gold);margin:20px 0 10px;padding-left:8px;border-left:3px solid var(--gold)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 13px;transition:.15s;position:relative}
  .card:hover{border-color:var(--gold-dim);transform:translateY(-2px)}
  .card .nm{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
  .card .own{font-size:12px;color:var(--gold-dim);margin-top:2px}
  .card .eff{font-size:12.5px;color:var(--muted);margin-top:6px}
  .tag{font-size:10.5px;padding:2px 7px;border-radius:9px;border:1px solid var(--line);color:var(--muted);margin-left:auto}
  .tag.tier{color:var(--chan);border-color:#5a4a8a}
  .tag.ingame{color:#7ee787;border-color:#2f6b3a}
  .tag.gap{color:#ff9e64;border-color:#7a4a2a}
  .wx-badge{font-size:11px;padding:2px 8px;border-radius:9px;font-weight:600}
  .wx-badge.wood{background:rgba(102,187,106,.18);color:var(--wood)}
  .wx-badge.fire{background:rgba(255,87,34,.18);color:var(--fire)}
  .wx-badge.earth{background:rgba(200,161,101,.18);color:var(--earth)}
  .wx-badge.metal{background:rgba(207,214,224,.16);color:var(--metal)}
  .wx-badge.water{background:rgba(79,195,247,.18);color:var(--water)}
  .wx-badge.none{background:rgba(120,120,140,.16);color:#888}
  .count{color:var(--muted);font-size:12px;margin-left:8px}

  /* 共鸣通道 */
  .chan{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;border-left:4px solid var(--chan)}
  .chan h3{font-size:16px;color:var(--chan);display:flex;align-items:center;gap:8px}
  .chan .pri{font-size:11px;padding:2px 9px;border-radius:10px;background:var(--gold);color:#1a1a2e;font-weight:700}
  .chan .pri.low{background:#444;color:var(--muted)}
  .chan p{font-size:13px;color:var(--muted);margin-top:8px}
  .chan .ex{font-size:12.5px;color:var(--text);margin-top:6px}
  .chan .need{font-size:12px;color:#ff9e64;margin-top:6px}
  .chan .st{font-size:11px;margin-top:6px;color:var(--muted)}

  table.cmp{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
  table.cmp th,table.cmp td{border:1px solid var(--line);padding:8px 10px;text-align:left}
  table.cmp th{background:var(--panel2);color:var(--gold)}
  table.cmp td.y{color:#7ee787} table.cmp td.n{color:#ff9e64}
  .note{background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:14px;font-size:13px;color:var(--muted);margin:14px 0}
  .note b{color:var(--gold)}
  footer{text-align:center;color:#555;font-size:12px;margin-top:30px}
</style>
</head>

<header>

  </div>
</header>

  <button data-t="fb" class="on">法宝汇总</button>

<main>
  <section id="fb" class="on"></section>

  <section id="beast"></section>
  <section id="cmp"></section>

</main>

// ===== 渲染 =====
var state={tab:"fb",wx:"all",q:""};

function match(item, fields){
  if(state.wx!="all" && item[fields.wx]!=state.wx) return false;
  if(state.q){
    var s=""; for(var k in fields){ if(typeof item[fields[k]]=="string") s+=item[fields[k]]; }
    if(s.toLowerCase().indexOf(state.q.toLowerCase())<0) return false;
  }
  return true;
}

function renderFB(){
  var groups={"封神·圣人级":[],"封神·阐教":[],"封神·截教散仙":[],"封神·哪吒系":[],"封神·李靖/其他":[],"封神·五方旗":[],"西游·老君系":[],"西游·佛系":[],"西游·其他":[]};
  var F={name:0,owner:1,src:2,wx:3,eff:4,ingame:5,tier:6};
  FB.forEach(function(it){
    if(!match(it,F)) return;
    var key;
    if(it[2]=="封神"){
      if(it[6]=="先天至宝"||it[6]=="先天灵宝"||["老子","元始天尊","通天教主","女娲","准提道人"].indexOf(it[1])>=0) key="封神·圣人级";
      else if(it[6]=="五方旗") key="封神·五方旗";
      else if(["哪吒"].indexOf(it[1])>=0) key="封神·哪吒系";
      else if(["广成子","赤精子","太乙真人","普贤真人","金咤","木吒","韦护","度厄真人","慈航道人","道德真君","黄天化","惧留孙"].indexOf(it[1])>=0) key="封神·阐教";
      else if(["李靖","雷震子","邓婵玉","余化","魔礼青","魔礼红","魔礼海","魔礼寿","罗宣","龙吉公主","火灵圣母","龟灵圣母","金灵圣母","殷郊","吕岳","法戒"].indexOf(it[1])>=0) key="封神·李靖/其他";
      else key="封神·截教散仙";
    } else {
      if(["太上老君","猪八戒","孙悟空","观音/金毛犼"].indexOf(it[1])>=0) key="西游·老君系";
      else if(it[1]=="如来") key="西游·佛系";
      else key="西游·其他";
    }
    groups[key].push(it);
  });
  var html="",total=0;
  Object.keys(groups).forEach(function(g){
    if(!groups[g].length) return;
    total+=groups[g].length;
    html+='<div class="group-title">'+g+'<span class="count">'+groups[g].length+'件</span></div><div class="grid">';
    groups[g].forEach(function(it){
      var tags=wxBadge(it[3]);
      if(it[6]) tags+=' <span class="tag tier">'+it[6]+'</span>';
      if(it[5]) tags+=' <span class="tag ingame">已在库</span>';
      else tags+=' <span class="tag gap">缺口</span>';
      html+='<div class="card"><div class="nm">'+it[0]+tags+'</div>'
        +'<div class="own">'+it[1]+' · '+it[2]+'</div>'
        +'<div class="eff">'+it[4]+'</div></div>';
    });
    html+='</div>';
  });
  if(!total) html='<div class="note">无匹配结果</div>';
  document.getElementById("fb").innerHTML=html;
}

function renderFS(){
  var F={name:0,owner:2,src:1,wx:4,type:3};
  var html='<div class="group-title">法术 · 神通<span class="count">'+FS.length+'项</span></div><div class="grid">';
  var n=0;
  FS.forEach(function(it){
    if(!match(it,F)) return; n++;
    html+='<div class="card"><div class="nm">'+it[0]+wxBadge(it[4])+'</div>'
      +'<div class="own">'+it[2]+' · '+it[1]+'</div>'
      +'<div class="eff">类型：'+it[3]+'</div></div>';
  });
  html+='</div>';
  if(!n) html='<div class="note">无匹配结果</div>';
  document.getElementById("fs").innerHTML=html;
}

function renderBeast(){
  var F={name:0,group:1,wx:2};

  order.forEach(function(g){

    n+=list.length;
    html+='<div class="group-title">'+g+'<span class="count">'+list.length+'</span></div><div class="grid">';

      html+='<div class="card"><div class="nm">'+it[0]+wxBadge(it[2])+'</div>'
        +'<div class="eff">'+it[1]+'</div></div>';
    });
    html+='</div>';
  });
  if(!n) html='<div class="note">无匹配结果</div>';
  document.getElementById("beast").innerHTML=html;
}

function renderChan(){
  var html='<div class="note"><b>共鸣引擎 = 纯基础设施（存储+触发）</b>，规则独立设计、按需注册（registerChannel），倍率相乘。'
    +'现状：wuxing 通道已实现（克×1.0/生×1.6/基础×1.3），set 通道留口子。以下为五行之外的 <b>8 条候选通道</b>，按优先级排序。'
    +'<br><b>组合规则</b>：当前 = 相乘（初版，⚪待决策，第二条通道上线时定稿）。</div>';
  CHAN.slice().sort(function(a,b){return a.p-b.p;}).forEach(function(c){
    var pri = c.p<=3 ? '<span class="pri">优先 P'+c.p+'</span>' : '<span class="pri low">P'+c.p+'</span>';
    html+='<div class="chan"><h3>'+c.name+' '+pri+'</h3>'
      +'<p>'+c.desc+'</p>'
      +'<div class="ex"><b>素材：</b>'+c.ex+'</div>'
      +'<div class="need"><b>数据需求：</b>'+c.need+'</div>'
      +'<div class="st">状态：'+c.st+'</div></div>';
  });
  document.getElementById("chan").innerHTML=html;
}

function render(){
  if(state.tab=="fb") renderFB();
  else if(state.tab=="fs") renderFS();
  else if(state.tab=="beast") renderBeast();
  else if(state.tab=="cmp") renderCmp();
  else if(state.tab=="chan") renderChan();
  // toolbar 只在 fb/fs/beast 显示
  document.getElementById("toolbar").style.display = (state.tab=="cmp"||state.tab=="chan")?"none":"flex";
}

// nav
document.getElementById("nav").addEventListener("click",function(e){
  if(e.target.tagName!="BUTTON") return;
  document.querySelectorAll("#nav button").forEach(function(b){b.classList.remove("on");});
  e.target.classList.add("on");
  document.querySelectorAll("section").forEach(function(s){s.classList.remove("on");});
  state.tab=e.target.dataset.t;
  document.getElementById(state.tab).classList.add("on");
  render();
});
// wx filter
document.getElementById("toolbar").addEventListener("click",function(e){
  if(!e.target.classList.contains("chip")) return;
  document.querySelectorAll(".chip").forEach(function(c){c.classList.remove("on");});
  e.target.classList.add("on");
  state.wx=e.target.dataset.wx;
  render();
});
// search
document.getElementById("q").addEventListener("input",function(e){
  state.q=e.target.value; render();
});

render();
