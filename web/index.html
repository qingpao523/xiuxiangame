<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>封神修道录</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap" />
  <link rel="stylesheet" href="style.css?v=20260904a" />
  <link rel="stylesheet" href="style-ui-v4.css?v=20260904c" />
</head>
<body>
  <div id="bg"></div>
  <div id="fx-seal"></div>
  <div id="dim"></div>

  <main id="app">
    <!-- ===== 天：卷首题头 ===== -->
    <header class="ui-topbar">
      <div class="ui-title">封神修道录</div>
      <div class="ui-sysbtns">
        <button class="ui-sysbtn" data-action="scroll">卷</button>
        <button class="ui-sysbtn" data-action="map">图</button>
        <button class="ui-sysbtn" data-action="audio">音</button>
      </div>
      <div class="ui-edict">
        <span class="ui-identity"></span>
        <span class="ui-weather"></span>
        <span class="ui-omen"></span>
        <span class="ui-seal">
          <span class="ui-seal-label">榜文感应</span>
          <span class="ui-seal-track"><i class="ui-seal-fill"></i></span>
          <span class="ui-seal-state">未显</span>
        </span>
      </div>
    </header>

    <!-- ===== 人：立绘主视觉 ===== -->
    <section class="ui-hero">
      <div class="ui-resources"></div>
      <div class="ui-stage">
        <div class="ui-char-aura"></div>
        <div class="ui-char-ground"></div>
        <img class="ui-char-img" src="assets/characters/char_cultivator.png" alt="修行者" />
        <div class="ui-treasure-orb hidden"></div>
        <div class="ui-action-toast hidden"></div>
      </div>
    </section>

    <!-- ===== 事：目标·道行·日志·主行动 ===== -->
    <section class="ui-affair">
      <div class="ui-goal">
        <p class="ui-goal-text"></p>
        <p class="ui-goal-reward"></p>
      </div>
      <div class="ui-dao">
        <span class="ui-dao-label"></span>
        <div class="ui-dao-bar"><i class="ui-dao-fill"></i></div>
      </div>
      <p class="ui-status"></p>
      <div class="ui-hints hidden"></div>
      <button class="ui-mainbtn">
        <i class="ui-mainbtn-progress"></i>
        <span class="ui-mainbtn-label">吐纳周天</span>
      </button>
      <div class="ui-autorow">
        <button class="ui-autotoggle">连续修行：关</button>
      </div>
    </section>

    <!-- ===== 路：底栏六玉牌 ===== -->
    <nav class="ui-nav">
      <button class="ui-navbtn" data-panel="realm"><span class="ui-nav-glyph">境</span><span class="ui-nav-name">境界</span></button>
      <button class="ui-navbtn" data-panel="map"><span class="ui-nav-glyph">游</span><span class="ui-nav-name">游历</span></button>
      <button class="ui-navbtn" data-panel="spell"><span class="ui-nav-glyph">术</span><span class="ui-nav-name">术法</span></button>
      <button class="ui-navbtn" data-panel="treasure"><span class="ui-nav-glyph">宝</span><span class="ui-nav-name">法宝</span></button>
      <button class="ui-navbtn" data-panel="chance"><span class="ui-nav-glyph">缘</span><span class="ui-nav-name">机缘</span></button>
      <button class="ui-navbtn" data-panel="log"><span class="ui-nav-glyph">志</span><span class="ui-nav-name">洞府</span></button>
    </nav>

    <div class="ui-debug hidden">
      <span>调试模式：当前节奏不代表正式体验</span>
      <button class="ui-debug-btn" data-action="ff">快进6时辰</button>
      <button class="ui-debug-btn" data-action="res">资源+5000</button>
      <button class="ui-debug-btn" data-action="battle">试斗一场</button>
    </div>
  </main>

  <!-- 功能面板（半屏抽屉） -->
  <div id="panel-layer" class="hidden">
    <div id="panel-sheet">
      <div id="panel-title"></div>
      <div id="panel-body"></div>
      <button id="panel-close" class="popup-btn">收起</button>
    </div>
  </div>

  <!-- 天象有变前奏 -->
  <div id="prelude" class="hidden">天象有变……</div>

  <!-- 弹窗层 -->
  <div id="popup-layer" class="hidden">
    <div id="popup-panel">
      <div id="popup-title"></div>
      <div id="popup-body"></div>
      <div id="popup-buttons"></div>
    </div>
  </div>

  <!-- 斗法场（全屏，一场一会话，禁止把结算钮挂到弹窗上） -->
  <div id="duel-layer" class="hidden">
    <div id="duel-root"></div>
  </div>

  <!-- 配招阵面 -->
  <div id="formation-layer" class="hidden">
    <div id="formation-root"></div>
  </div>

  <!-- 破劫演出 -->
  <div id="tribulation-fx" class="hidden"><span>劫云压顶</span></div>

  <!-- 开局卷首演出 -->
  <div id="prologue-layer" class="hidden">
    <div id="prologue-gold" aria-hidden="true"></div>
    <div id="prologue-scroll"><div id="prologue-stage"></div></div>
    <div id="prologue-hint">轻触继续</div>
    <button id="prologue-skip">跳过卷首</button>
  </div>

  <!-- 封神图卷（山河卷轴） -->
  <div id="world-scroll-layer" class="hidden">
    <div id="world-scroll-panel">
      <header id="world-scroll-head">
        <div>
          <div id="world-scroll-title">封神图卷</div>
          <div id="world-scroll-sub"></div>
        </div>
        <button id="world-scroll-close">收起</button>
      </header>
      <div id="world-scroll-body"></div>
      <footer id="world-scroll-foot"></footer>
    </div>
  </div>

  <!-- 封神山河图（无美术素材期的示意图，正式地图素材就位后替换） -->
  <div id="world-map-layer" class="hidden">
    <div id="world-map-panel">
      <header id="world-map-head">
        <div>
          <div id="world-map-title">封神山河图</div>
          <div id="world-map-sub"></div>
        </div>
        <button id="world-map-close">收起</button>
      </header>
      <div id="world-map-canvas"></div>
      <footer id="world-map-foot"></footer>
    </div>
  </div>

  <!-- 小仪式层（阶段转换的呼吸时刻，零交互自动消散） -->
  <div id="ritual-layer" class="hidden">
    <div id="ritual-light"></div>
    <div id="ritual-text"></div>
  </div>

  <!-- 生活技艺·火候时机条（炼丹/画符的手感操作） -->
  <div id="craft-layer" class="hidden">
    <div id="craft-panel">
      <div id="craft-title">炉火</div>
      <div id="craft-prompt">看准火候，按下停手</div>
      <div id="craft-bar">
        <div id="craft-zone"></div>
        <div id="craft-marker"></div>
      </div>
      <div id="craft-result"></div>
      <button id="craft-stop">停手</button>
    </div>
  </div>

  <!-- 大画卷层（破劫/关键叙事的沉浸演出） -->
  <div id="ss-layer" class="hidden">
    <div id="ss-stage"></div>
    <div id="ss-hint">轻触继续</div>
    <button id="ss-skip">跳过</button>
  </div>

  <!-- 核心模块 -->
  <script src="js/utils.js?v=20260904b"></script>
  <script src="js/constants.js"></script>
  <script src="js/audio-manager.js"></script>
  <script src="js/data-manager.js"></script>
  <script src="js/feedback-renderer.js?v=20260831d"></script>
  <script src="js/realm-manager.js"></script>
  <script src="js/save-manager.js"></script>
  <script src="js/unlock-manager.js"></script>
  <script src="js/event-manager.js"></script>
  <script src="js/reward-manager.js"></script>
  <script src="js/action-manager.js"></script>
  <script src="js/goal-manager.js"></script>
  <script src="js/boss-manager.js"></script>
  <script src="js/breakthrough-manager.js"></script>
  <script src="js/resonance-system.js"></script>
  <script src="js/skill-identity.js"></script>
  <script src="js/battle-engine-v2.js"></script>
  <script src="js/boss-mechanics-v2.js"></script>
  <script src="js/battle-ui-v2.js"></script>
  <script src="js/scroll-scene.js"></script>
  <script src="js/atmosphere.js"></script>
  <script src="js/craft.js"></script>
  <script src="js/liupai-manager.js"></script>
  <script src="js/gameplay-engine.js"></script>
  <script src="js/content-director.js"></script>
  <script src="js/game.js?v=20260823e"></script>
  <script src="js/world-scroll.js"></script>
  <script src="js/world-map.js"></script>
  <script src="js/ui-constants.js"></script>
  <script src="config.js?v=20260828a"></script>
  <script src="js/api-client.js?v=20260828a"></script>
  <!-- design/19.0 G2：六抽屉独立渲染单元（注册 window.PANEL_UNITS，须在 ui.js 前） -->
  <script src="js/panels/realm-panel.js?v=20260829a"></script>
  <script src="js/panels/map-panel.js?v=20260829a"></script>
  <script src="js/panels/spell-panel.js?v=20260829a"></script>
  <script src="js/panels/treasure-panel.js?v=20260829a"></script>
  <script src="js/panels/chance-panel.js?v=20260829a"></script>
  <script src="js/panels/log-panel.js?v=20260829a"></script>
  <!-- design/19.0 G3：面板迁 Vue（自托管 global build，无构建；不可用时 ui.js 自动回落 PANEL_UNITS） -->
  <script src="js/vendor/vue.global.prod.js?v=20260829a"></script>
  <script src="js/panels/vue-panel-mount.js?v=20260829a"></script>
  <script src="js/panels/treasure-panel-vue.js?v=20260829a"></script>
  <script src="js/panels/chance-panel-vue.js?v=20260829a"></script>
  <script src="js/panels/realm-panel-vue.js?v=20260829a"></script>
  <script src="js/panels/spell-panel-vue.js?v=20260829a"></script>
  <script src="js/panels/map-panel-vue.js?v=20260829a"></script>
  <script src="js/panels/log-panel-vue.js?v=20260829a"></script>
  <script src="js/ui.js?v=20260904c"></script>
</body>
</html>
