<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>封神修道录</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap" />
  <link rel="stylesheet" href="style.css?v=20260823c" />
</head>
<body>
  <div id="bg"></div>
  <div id="fx-seal"></div>
  <div id="dim"></div>

  <main id="app">
      <!-- 顶部封神天象条 -->
      <header id="top-banner">
        <div class="banner-top">
          <div id="game-title" title="点击展开封神图卷">封神修道录</div>
          <div class="banner-tools">
            <button id="world-scroll-btn" class="scroll-open" title="展开封神图卷">卷</button>
            <button id="world-map-btn" class="scroll-open map-open" title="展开封神山河图">图</button>
            <button id="audio-settings-btn" class="scroll-open audio-open" title="声音设置">音</button>
          </div>
        </div>
        <div id="identity-line"></div>
        <div class="banner-sub">
          <span id="weather-line"></span>
          <span id="omen-line"></span>
        </div>
        <div id="seal-pressure" title="封神榜对你的感应">
          <span id="seal-pressure-label">榜文感应</span>
          <span id="seal-pressure-track"><i id="seal-pressure-fill"></i></span>
          <span id="seal-pressure-state">未显</span>
        </div>
      </header>

    <!-- 资源浮层 -->
    <div id="resource-strip"></div>

    <!-- 主角舞台 -->
    <section id="stage">
      <div id="char-aura"></div>
      <div id="char-ground"></div>
      <div id="cave-motes" aria-hidden="true"></div>
      <img id="char-img" src="assets/characters/char_cultivator.png" alt="修行者" />
      <div id="treasure-orb" class="hidden"></div>
      <div id="action-toast" class="hidden"></div>
    </section>

    <!-- 当前目标 -->
    <section id="goal-panel">
      <div id="goal-text"></div>
      <div id="goal-reward"></div>
    </section>

    <!-- 道行进度 -->
    <section id="progress-zone">
      <div id="progress-label"></div>
      <div id="progress-bar"><div id="progress-fill"></div></div>
    </section>

    <!-- 修行日志（最新一条） -->
    <div id="status-line"></div>

    <!-- 唯一主行动按钮 -->
    <button id="main-btn">
      <div id="main-btn-progress"></div>
      <span id="main-btn-label">吐纳周天</span>
    </button>

    <!-- 次级推荐：不阻断主修行，玩家可自由选择 -->
    <div id="action-hints" class="hidden"></div>

    <div id="auto-row">
      <button id="auto-toggle">连续修行：关</button>
    </div>

    <!-- 底部功能导航 -->
    <nav id="bottom-nav">
      <button class="nav-btn" data-panel="realm"><span class="nav-glyph">境</span><span class="nav-name">境界</span></button>
      <button class="nav-btn" data-panel="map"><span class="nav-glyph">游</span><span class="nav-name">游历</span></button>
      <button class="nav-btn" data-panel="spell"><span class="nav-glyph">术</span><span class="nav-name">术法</span></button>
      <button class="nav-btn" data-panel="treasure"><span class="nav-glyph">宝</span><span class="nav-name">法宝</span></button>
      <button class="nav-btn" data-panel="chance"><span class="nav-glyph">缘</span><span class="nav-name">机缘</span></button>
      <button class="nav-btn" data-panel="log"><span class="nav-glyph">志</span><span class="nav-name">洞府</span></button>
    </nav>

    <div id="debug-bar" class="hidden">
      <span>调试模式：当前节奏不代表正式体验</span>
      <button id="debug-ff">快进6时辰</button>
      <button id="debug-res">资源+5000</button>
      <button id="debug-battle">试斗一场</button>
    </div>
  </main>

  <!-- 功能面板（半屏抽屉） -->
  <div id="panel-layer" class="hidden">
    <div id="panel-sheet">
      <div id="panel-title"></div>
      <div id="panel-body"></div>
      <button id="panel-close" class="popup-btn">收起</button>
    </div>
  </div>

  <!-- 天象有变前奏 -->
  <div id="prelude" class="hidden">天象有变……</div>

  <!-- 弹窗层 -->
  <div id="popup-layer" class="hidden">
    <div id="popup-panel">
      <div id="popup-title"></div>
      <div id="popup-body"></div>
      <div id="popup-buttons"></div>
    </div>
  </div>

  <!-- 斗法场（全屏，一场一会话，禁止把结算钮挂到弹窗上） -->
  <div id="duel-layer" class="hidden">
    <div id="duel-root"></div>
  </div>

  <!-- 配招阵面 -->
  <div id="formation-layer" class="hidden">
    <div id="formation-root"></div>
  </div>

  <!-- 破劫演出 -->
  <div id="tribulation-fx" class="hidden"><span>劫云压顶</span></div>

  <!-- 开局卷首演出 -->
  <div id="prologue-layer" class="hidden">
    <div id="prologue-gold" aria-hidden="true"></div>
    <div id="prologue-scroll"><div id="prologue-stage"></div></div>
    <div id="prologue-hint">轻触继续</div>
    <button id="prologue-skip">跳过卷首</button>
  </div>

  <!-- 封神图卷（山河卷轴） -->
  <div id="world-scroll-layer" class="hidden">
    <div id="world-scroll-panel">
      <header id="world-scroll-head">
        <div>
          <div id="world-scroll-title">封神图卷</div>
          <div id="world-scroll-sub"></div>
        </div>
        <button id="world-scroll-close">收起</button>
      </header>
      <div id="world-scroll-body"></div>
      <footer id="world-scroll-foot"></footer>
    </div>
  </div>

  <!-- 封神山河图（无美术素材期的示意图，正式地图素材就位后替换） -->
  <div id="world-map-layer" class="hidden">
    <div id="world-map-panel">
      <header id="world-map-head">
        <div>
          <div id="world-map-title">封神山河图</div>
          <div id="world-map-sub"></div>
        </div>
        <button id="world-map-close">收起</button>
      </header>
      <div id="world-map-canvas"></div>
      <footer id="world-map-foot"></footer>
    </div>
  </div>

  <!-- 小仪式层（阶段转换的呼吸时刻，零交互自动消散） -->
  <div id="ritual-layer" class="hidden">
    <div id="ritual-light"></div>
    <div id="ritual-text"></div>
  </div>

  <!-- 生活技艺·火候时机条（炼丹/画符的手感操作） -->
  <div id="craft-layer" class="hidden">
    <div id="craft-panel">
      <div id="craft-title">炉火</div>
      <div id="craft-prompt">看准火候，按下停手</div>
      <div id="craft-bar">
        <div id="craft-zone"></div>
        <div id="craft-marker"></div>
      </div>
      <div id="craft-result"></div>
      <button id="craft-stop">停手</button>
    </div>
  </div>

  <!-- 大画卷层（破劫/关键叙事的沉浸演出） -->
  <div id="ss-layer" class="hidden">
    <div id="ss-stage"></div>
    <div id="ss-hint">轻触继续</div>
    <button id="ss-skip">跳过</button>
  </div>

  <!-- 核心模块 -->
  <script src="js/utils.js"></script>
  <script src="js/constants.js"></script>
  <script src="js/audio-manager.js"></script>
  <script src="js/data-manager.js"></script>
  <script src="js/realm-manager.js"></script>
  <script src="js/save-manager.js"></script>
  <script src="js/unlock-manager.js"></script>
  <script src="js/event-manager.js"></script>
  <script src="js/reward-manager.js"></script>
  <script src="js/action-manager.js"></script>
  <script src="js/goal-manager.js"></script>
  <script src="js/boss-manager.js"></script>
  <script src="js/breakthrough-manager.js"></script>
  <script src="js/resonance-system.js"></script>
  <script src="js/battle-engine-v2.js"></script>
  <script src="js/boss-mechanics-v2.js"></script>
  <script src="js/battle-ui-v2.js"></script>
  <script src="js/scroll-scene.js"></script>
  <script src="js/atmosphere.js"></script>
  <script src="js/craft.js"></script>
  <script src="js/liupai-manager.js"></script>
  <script src="js/gameplay-engine.js"></script>
  <script src="js/content-director.js"></script>
  <script src="js/game.js"></script>
  <script src="js/world-scroll.js"></script>
  <script src="js/world-map.js"></script>
  <script src="js/ui-constants.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
