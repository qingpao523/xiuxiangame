<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>共鸣系统 · 多通道框架预览</title>
<script src="js/resonance-system.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background:#0e1116; color:#e8e6df; font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100vh; padding:28px 18px; display:flex; flex-direction:column; align-items:center; }
  h1 { font-size:20px; color:#FFD700; margin-bottom:6px; letter-spacing:1px; }
  .sub { font-size:12px; color:#8a8f98; margin-bottom:20px; text-align:center; line-height:1.7; }
  .panel { background:#171c24; border:1px solid #2a323d; border-radius:12px; padding:22px 18px; width:100%; max-width:600px; }
  .chain { display:flex; align-items:stretch; justify-content:center; gap:6px; margin:8px 0 18px; }
  .slot { width:58px; height:58px; border-radius:10px; display:flex; flex-direction:column; align-items:center;
    justify-content:center; font-size:13px; font-weight:700; border:2px solid; flex-shrink:0; }
  .slot .idx { font-size:11px; opacity:.7; }
  .gap { flex:1; min-width:80px; border-radius:10px; background:#10151c; border:1px dashed #33404e;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; padding:6px 4px; }
  .gap .foe-tag { font-size:11px; color:#c98a8a; }
  .gap .foe-el { font-size:15px; font-weight:700; }
  .gap .reso { font-size:12px; font-weight:700; padding:2px 8px; border-radius:8px; }
  .reso.base { color:#7ee787; background:rgba(126,231,135,.12); }
  .reso.broken { color:#ff6b6b; background:rgba(255,107,107,.14); }
  .reso.enhanced { color:#FFD700; background:rgba(255,215,0,.14); }
  .reso.none { color:#6a7480; background:rgba(120,130,140,.10); }
  .ctrl { margin:13px 0; }
  .ctrl .lbl { font-size:12px; color:#9aa3ad; margin-bottom:7px; }
  .btns { display:flex; gap:7px; flex-wrap:wrap; }
  .ebtn { padding:7px 13px; border-radius:8px; border:1px solid #3a4450; background:#1d242e; color:#cfd6dd;
    font-size:13px; cursor:pointer; transition:all .15s; user-select:none; }
  .ebtn:hover { border-color:#5a6472; }
  .ebtn.sel { background:#FFD700; color:#1a1a1a; border-color:#FFD700; font-weight:700; }
  .ebtn.foe.sel { background:#ff6b6b; border-color:#ff6b6b; color:#1a1a1a; }
  .ebtn.none.sel { background:#6c7683; border-color:#6c7683; color:#fff; }
  .roll { margin-top:15px; width:100%; padding:11px; border-radius:10px; border:none;
    background:linear-gradient(90deg,#c9a227,#FFD700); color:#1a1a1a; font-size:14px; font-weight:700; cursor:pointer; }
  .summary { margin-top:16px; padding:12px 14px; background:#10151c; border-radius:10px; font-size:13px; line-height:1.9; }
  .summary b { color:#FFD700; }
  .channels { margin-top:14px; font-size:12px; line-height:1.9; }
  .ch { padding:6px 10px; border-radius:8px; margin-bottom:6px; border:1px solid #2a323d; }
  .ch.on { border-color:#3a5a3a; background:rgba(126,231,135,.06); }
  .ch.off { opacity:.55; }
  .ch .tag { font-size:10px; padding:1px 6px; border-radius:6px; margin-left:6px; }
  .ch .tag.live { background:#7ee787; color:#10151c; }
  .ch .tag.hook { background:#4a5560; color:#cfd6dd; }
  .kring { margin-top:14px; font-size:11px; color:#6a7480; text-align:center; line-height:1.7; }
</style>
</head>
<body>
  <h1>共鸣系统 · 多通道框架预览</h1>
  <div class="sub">共鸣有多种通道：五行共鸣（第一期已接）/ 套装共鸣（如哪吒三件套·留口子）/ …<br>
    选我方招式五行（①②③同五行）+ 夹招五行，看哪种共鸣生效。只有「带五行」的招式才触发五行共鸣。</div>

  <div class="panel">
    <div class="chain" id="chain"></div>

    <div class="ctrl">
      <div class="lbl">我方招式五行（①②③ 同五行）</div>
      <div class="btns" id="playerBtns"></div>
    </div>
    <div class="ctrl">
      <div class="lbl">敌 a 夹招五行（夹在 ①② 之间）</div>
      <div class="btns" id="midABtns"></div>
    </div>
    <div class="ctrl">
      <div class="lbl">敌 b 夹招五行（夹在 ②③ 之间）</div>
      <div class="btns" id="midBBtns"></div>
    </div>

    <button class="roll" id="rollBtn">🎲 随机 roll 夹招五行</button>

    <div class="summary" id="summary"></div>
    <div class="channels" id="channels"></div>

    <div class="kring">
      五行相克：木克土 → 土克水 → 水克火 → 火克金 → 金克木<br>
      五行相生：木生火 → 火生土 → 土生金 → 金生水 → 水生木<br>
      倍率：被破 ×1.0 ｜ 基础 ×1.3 ｜ 增强 ×1.6（初版占位 · 关系图数据驱动可扩充）
    </div>
  </div>

<script>
(function () {
  var RS = window.ResonanceSystem;
  var ORDER = ["wood", "fire", "earth", "metal", "water"];
  var state = { player: "fire", midA: "water", midB: null };

  function wChip(el) {
    if (el == null) return '<span style="color:#6a7480">无</span>';
    return '<span style="color:' + RS.wuxingColor(el) + '">' + RS.wuxingLabel(el) + '</span>';
  }
  // 用框架统一求值（left=我方五行，middle=夹招五行）
  function evalGap(midEl) {
    return RS.evaluate({ leftWuxing: state.player, middleWuxing: midEl });
  }
  function resoBadge(r) {
    if (r.results.length === 0) return '<span class="reso none">无五行共鸣 ×1.0</span>';
    var w = r.results[0];
    if (w.broken) return '<span class="reso broken">被破 ×1.0</span>';
    if (w.enhanced) return '<span class="reso enhanced">增强 ×1.6</span>';
    return '<span class="reso base">基础 ×1.3</span>';
  }
  function slot(idx, el) {
    var c = RS.wuxingColor(el);
    return '<div class="slot" style="border-color:' + c + ';color:' + c + '">'
      + '<span class="idx">' + idx + '</span><span>' + RS.wuxingLabel(el) + '</span></div>';
  }
  function gapBox(tag, midEl) {
    return '<div class="gap"><div class="foe-tag">' + tag + '</div>'
      + '<div class="foe-el">' + wChip(midEl) + '</div>' + resoBadge(evalGap(midEl)) + '</div>';
  }

  function render() {
    var html = slot("①", state.player) + gapBox("敌 a", state.midA) + slot("②", state.player)
      + gapBox("敌 b", state.midB) + slot("③", state.player);
    document.getElementById("chain").innerHTML = html;

    var rA = evalGap(state.midA), rB = evalGap(state.midB);
    var sum = "";
    sum += "② 共鸣（①②）：夹招 " + wChip(state.midA) + " → " + describe(rA, state.midA) + "<br>";
    sum += "③ 共鸣（②③）：夹招 " + wChip(state.midB) + " → " + describe(rB, state.midB) + "<br>";
    sum += "<b>组合规则</b>：各通道倍率相乘（初版）；当前仅五行通道在线。";
    document.getElementById("summary").innerHTML = sum;

    // 通道面板（体现留口子）
    var ch = "";
    ch += '<div class="ch on">① 五行共鸣 <span class="tag live">已接入</span> — 木火土金水 生克；仅当招式带五行触发。克环+增幅数据驱动，可不断丰富。</div>';
    ch += '<div class="ch off">② 套装共鸣 <span class="tag hook">留口子·待接入</span> — 如「哪吒三件套」；触发条件/倍率待设计，registerChannel 挂入即可。</div>';
    ch += '<div class="ch off">③ 其他共鸣 <span class="tag hook">留口子·待接入</span> — 框架可扩展，新增通道不改引擎。</div>';
    document.getElementById("channels").innerHTML = ch;
  }
  function describe(r, midEl) {
    if (r.results.length === 0) return '<span style="color:#6a7480">无五行共鸣（夹招不带五行）→ ×1.0</span>';
    var w = r.results[0];
    if (w.broken) return '<span style="color:#ff6b6b">被破 ×1.0（' + RS.wuxingLabel(midEl) + ' 克 ' + RS.wuxingLabel(state.player) + '）</span>';
    if (w.enhanced) return '<span style="color:#FFD700">增强 ×1.6（' + RS.wuxingLabel(midEl) + ' 生 ' + RS.wuxingLabel(state.player) + '）</span>';
    return '<span style="color:#7ee787">基础 ×1.3</span>';
  }

  function buildBtns(id, kind) {
    var c = document.getElementById(id), html = "";
    ORDER.forEach(function (el) {
      html += '<div class="ebtn ' + (kind === "player" ? "" : "foe") + '" data-kind="' + kind + '" data-el="' + el + '">' + RS.wuxingLabel(el) + '</div>';
    });
    if (kind !== "player") html += '<div class="ebtn none" data-kind="' + kind + '" data-el="">无</div>';
    c.innerHTML = html;
    c.querySelectorAll(".ebtn").forEach(function (b) {
      b.addEventListener("click", function () {
        var el = b.getAttribute("data-el") || null;
        if (kind === "player") state.player = el;
        else if (kind === "midA") state.midA = el;
        else state.midB = el;
        sync(); render();
      });
    });
  }
  function sync() {
    document.querySelectorAll(".ebtn").forEach(function (b) {
      var k = b.getAttribute("data-kind"), el = b.getAttribute("data-el") || null;
      var cur = k === "player" ? state.player : (k === "midA" ? state.midA : state.midB);
      b.classList.toggle("sel", cur === el);
    });
  }
  document.getElementById("rollBtn").addEventListener("click", function () {
    state.midA = ORDER[Math.floor(Math.random() * ORDER.length)];
    state.midB = ORDER[Math.floor(Math.random() * ORDER.length)];
    sync(); render();
  });
  buildBtns("playerBtns", "player");
  buildBtns("midABtns", "midA");
  buildBtns("midBBtns", "midB");
  sync(); render();
})();
</script>
</body>
</html>
